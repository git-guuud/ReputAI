# ENSv2 Agent-Bound Identity Sandbox
# Matches the upstream ensdomains/contracts-v2 profile so ENSv2 sources
# compile identically here (evm_version + optimizer settings must agree).

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]
ignored_warnings_from = ["lib/"]

[fuzz]
runs = 256

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
